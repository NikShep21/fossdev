services:
  product_service:
    build: ./product_service

    ports:
      - "8001:8000"
    networks:
      - service-net
  order_service:
    build: ./order_service
    ports:
      - "8002:8000"
    environment:
      - PRODUCT_SERVICE_URL=http://product_service:8000

    depends_on:
      - product_service
    networks:
      - service-net
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=orders
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u app -d orders"]
      interval: 1m30s
      timeout: 30s
      retries: 5

networks:
  service-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
volumes:
  order-db-data:
